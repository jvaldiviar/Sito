<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

.csl-community-bridge,
.csl-community-bridge * {
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}


/* ==================================================
   SEZIONE
================================================== */

.csl-community-bridge {
    position: relative;

    width: 100%;
    min-height: 190px;

    display: flex;
    align-items: center;
    justify-content: center;

    /* MODIFICA QUESTO VALORE PER REGOLARE
       LO SPAZIO SOPRA E SOTTO */
    padding: 24px 5%;

    background: #3d86c6;

    overflow: hidden;
}


/* ==================================================
   IMMAGINE CONNIE
================================================== */

.csl-community-bridge__image-area {
    position: absolute;

    left: 5%;
    top: 50%;

    transform: translateY(-50%);

    width: 175px;

    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


.csl-community-bridge__image {
    display: block;

    width: 100%;
    height: auto;

    max-height: 180px;

    object-fit: contain;
    object-position: center;
}


/* ==================================================
   CONTENUTO CENTRALE
================================================== */

.csl-community-bridge__content {
    position: relative;

    z-index: 3;

    width: min(850px, 70%);

    margin: 0 auto;

    text-align: center;
}


/* ==================================================
   FRASE
================================================== */

.csl-community-bridge__title {
    max-width: 820px;

    margin: 0 auto 20px;

    color: #ffffff;

    font-size: clamp(21px, 2vw, 28px);
    line-height: 1.3;

    font-weight: 600;

    letter-spacing: -0.3px;
}


.csl-community-bridge__title-line {
    display: block;
}


/* ==================================================
   BOTTONI
================================================== */

.csl-community-bridge__actions {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 14px;
}


.csl-community-bridge__btn {
    min-width: 220px;
    min-height: 52px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 16px 28px;

    border-radius: 999px;

    font-size: 16px;
    line-height: 1;

    font-weight: 500;

    text-decoration: none;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        color .2s ease;
}


.csl-community-bridge__btn:hover {
    transform: translateY(-2px);
}


/* ==================================================
   BOTTONE OFFERTA DOMESTICA
================================================== */

.csl-community-bridge__btn--private {
    color: #ffffff;

    background: #f5b52b;

    border: 1px solid #f5b52b;

    box-shadow:
        0 5px 14px rgba(30, 50, 70, .12);
}


.csl-community-bridge__btn--private:hover {
    background: #efa916;

    box-shadow:
        0 8px 18px rgba(30, 50, 70, .18);
}


/* ==================================================
   BOTTONE BUSINESS
================================================== */

.csl-community-bridge__btn--business {
    color: #ffffff;

    background: transparent;

    border: 1px solid rgba(255,255,255,.85);
}


.csl-community-bridge__btn--business:hover {
    color: #3d86c6;

    background: #ffffff;
}


/* ==================================================
   TABLET
================================================== */

@media (max-width: 950px) {

    .csl-community-bridge {
        min-height: 185px;

        padding: 22px 4% 22px 150px;
    }


    .csl-community-bridge__image-area {
        left: 2.5%;
        top: 50%;

        transform: translateY(-50%);

        width: 140px;
    }


    .csl-community-bridge__image {
        max-height: 165px;
    }


    .csl-community-bridge__content {
        width: 100%;
    }

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 650px) {

    .csl-community-bridge {
        min-height: auto;

        padding: 28px 20px 0;

        display: flex;
        flex-direction: column;
    }


    .csl-community-bridge__content {
        width: 100%;

        order: 1;
    }


    .csl-community-bridge__title {
        max-width: 430px;

        margin-bottom: 18px;

        font-size: 20px;
        line-height: 1.35;
    }


    .csl-community-bridge__title-line {
        display: inline;
    }


    .csl-community-bridge__actions {
        flex-direction: column;

        gap: 9px;
    }


    .csl-community-bridge__btn {
        width: 100%;
        max-width: 290px;

        min-width: 0;

        padding: 16px 24px;

        font-weight: 500;
    }


    /* ==================================================
       IMMAGINE MOBILE
    ================================================== */

    .csl-community-bridge__image-area {
        position: relative;

        left: auto;
        top: auto;

        transform: none;

        order: 2;

        width: 125px;

        margin: 20px auto 0;
    }


    .csl-community-bridge__image {
        max-height: none;
    }

}

</style>


<section class="csl-community-bridge">


    <!-- ==================================================
         IMMAGINE CONNIE
    =================================================== -->

    <div class="csl-community-bridge__image-area">

        <img
            class="csl-community-bridge__image"
            src="https://assets.zyrosite.com/KAOL3lZnFqGTdVeo/connie-pallino-bianco-PPXieCR2Mbh5QiMK.png"
            alt=""
        >

    </div>



    <!-- ==================================================
         CONTENUTO
    =================================================== -->

    <div class="csl-community-bridge__content">


        <!-- FRASE -->

        <h2 class="csl-community-bridge__title">

            <span class="csl-community-bridge__title-line">
                L'energia solare non resta sul tetto di chi la produce:
            </span>

            <span class="csl-community-bridge__title-line">
                viene condivisa con la nostra comunità.
            </span>

        </h2>



        <!-- ==================================================
             BOTTONI
        ================================================== -->

        <div class="csl-community-bridge__actions">


            <!-- OFFERTA DOMESTICA -->

            <a
                class="csl-community-bridge__btn csl-community-bridge__btn--private"
                href="#"
            >
                Offerta domestica
            </a>


            <!-- OFFERTA BUSINESS -->

            <a
                class="csl-community-bridge__btn csl-community-bridge__btn--business"
                href="#"
            >
                Offerta Business
            </a>


        </div>

    </div>

</section>
