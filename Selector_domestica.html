<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

/* =========================================
   SELETTORE OFFERTA CASA / BUSINESS
========================================= */

.csl-offer-switch,
.csl-offer-switch * {
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

.csl-offer-switch {
    width: min(520px, 92%);
    margin: 0 auto;

    display: flex;
    align-items: stretch;

    border-bottom: 1px solid #d5dade;
}


/* SINGOLA VOCE */

.csl-offer-switch__item {
    position: relative;

    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 9px;

    padding: 14px 16px 15px;

    color: #7a858c;

    font-size: 15px;
    line-height: 1.2;
    font-weight: 400;

    text-decoration: none;

    transition:
        color .25s ease,
        font-weight .25s ease;
}


/* ICONA */

.csl-offer-switch__icon {
    width: 20px;
    height: 20px;

    flex: 0 0 20px;

    stroke: currentColor;
}


/* LINEA ATTIVA */

.csl-offer-switch__item::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: -2px;

    height: 3px;

    background: #3f444a;

    transform: scaleX(0);

    transform-origin: center;

    transition: transform .3s ease;
}


/* CASA ATTIVA */

.csl-offer-switch__item--active {
    color: #3f444a;
    font-weight: 600;

    cursor: default;
}

.csl-offer-switch__item--active::after {
    transform: scaleX(1);
}


/* BUSINESS */

.csl-offer-switch__item--link:hover {
    color: #3f444a;
}

.csl-offer-switch__item--link:hover::after {
    transform: scaleX(1);
}


/* MOBILE */

@media (max-width: 520px) {

    .csl-offer-switch {
        width: 94%;
    }

    .csl-offer-switch__item {
        gap: 7px;

        padding: 13px 7px 14px;

        font-size: 13px;
    }

    .csl-offer-switch__icon {
        width: 18px;
        height: 18px;

        flex-basis: 18px;
    }
}

</style>


<nav class="csl-offer-switch" aria-label="Seleziona tipologia offerta">


    <!-- =====================================
         OFFERTA CASA - PAGINA ATTUALE
    ====================================== -->

    <span
        class="csl-offer-switch__item
               csl-offer-switch__item--active"
        aria-current="page"
    >

        <!-- ICONA CASA -->
        <svg
            class="csl-offer-switch__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M3 10.5L12 3l9 7.5"></path>
            <path d="M5 9.5V21h14V9.5"></path>
            <path d="M9 21v-7h6v7"></path>
        </svg>

        <span>Offerta Casa</span>

    </span>


    <!-- =====================================
         OFFERTA BUSINESS
         
         Quando pubblichi la pagina Business,
         sostituisci LINK-PAGINA-BUSINESS
         con il suo URL.
    ====================================== -->

    <a
        class="csl-offer-switch__item
               csl-offer-switch__item--link"
        href="https://terrava-farming-equipment-store-builder-eyrnokz2se8k5taz.hostingersite.com/offerta-luce-business"
        target="_top"
    >

        <!-- ICONA BUSINESS -->
        <svg
            class="csl-offer-switch__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <rect
                x="3"
                y="7"
                width="18"
                height="13"
                rx="2"
            ></rect>

            <path
                d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7"
            ></path>

            <path d="M3 12h18"></path>
            <path d="M10 12v2h4v-2"></path>
        </svg>

        <span>Offerta Business</span>

    </a>

</nav>
