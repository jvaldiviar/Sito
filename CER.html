           src="${logoURL}"
           alt="Logo ${escapeHTML(item.nome)}"
         >`
      : `<span class="cso-archivio__logo-placeholder">
           LOGO
         </span>`;

    const dataHTML = item.data
      ? escapeHTML(item.data)
      : "Da inserire";

    /* DOCUMENTI:
       STATUTO E ATTO COSTITUTIVO
       SEMPRE VISIBILI NEL PANNELLO */

    let documentsHTML = "";

    const documenti = Array.isArray(item.documenti)
      ? item.documenti
      : [];

    documenti.forEach(doc => {

      const docURL = doc.url
        ? safeURL(doc.url)
        : "";

      if (docURL) {

        documentsHTML += `
          <a
            class="cso-archivio__document-link"
            href="${docURL}"
            download
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>${escapeHTML(doc.nome)}</span>
            ${iconDownload}
          </a>
        `;

      } else {

        documentsHTML += `
          <div
            class="cso-archivio__document-unavailable"
            title="Documento non ancora disponibile"
          >
            <span>${escapeHTML(doc.nome)}</span>
            ${iconDownload}
          </div>
        `;

      }

    });

    /* EMAIL */

    const email = String(
      item.email || ""
    ).trim();

    const validEmail =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    const contactHTML = validEmail
      ? `
        <a href="mailto:${escapeHTML(email)}">
          ${iconMail}
          <span class="cso-archivio__email-text">
            ${escapeHTML(email)}
          </span>
        </a>
      `
      : `
        <span class="cso-archivio__contact-placeholder">
          ${iconMail}
          <span class="cso-archivio__email-text">
            Email da inserire
          </span>
        </span>
      `;

    /* HTML SCHEDA */

    card.innerHTML = `

      <!-- LOGO + INFORMAZIONI -->

      <div class="cso-archivio__card-top">

        <div class="cso-archivio__logo">
          ${logoHTML}
        </div>

        <div class="cso-archivio__main-info">

          <span class="cso-archivio__type">
            <span
              class="cso-archivio__dot ${typeClass}">
            </span>
            ${escapeHTML(item.tipo)}
          </span>

          <h3 class="cso-archivio__name">
            ${escapeHTML(item.nome)}
          </h3>

          <p class="cso-archivio__detail">
            <span class="cso-archivio__detail-label">
              Costituzione:
            </span>
            ${dataHTML} · ${escapeHTML(item.regione)}
          </p>

        </div>

      </div>

      <!-- DOCUMENTI -->

      <div class="cso-archivio__documents">

        <div class="cso-archivio__documents-list">
          ${documentsHTML}
        </div>

      </div>

      <!-- EMAIL -->

      <div class="cso-archivio__contact">
        ${contactHTML}
      </div>

    `;

    return card;
  }

  /* =====================================
     ORDINE ALFABETICO
  ===================================== */

  comunita.sort((a, b) =>
    a.citta.localeCompare(
      b.citta,
      "it",
      { sensitivity: "base" }
    )
  );

  /* =====================================
     MOSTRA ALTRE / MOSTRA MENO
  ===================================== */

  function render() {

    const filtered = comunita.filter(item => !regionSelect.value || item.regione === regionSelect.value);
    const visible = expanded ? filtered : filtered.slice(0, INITIAL_COUNT);
    count.textContent = filtered.length + " comunità";

    grid.replaceChildren();

    visible.forEach(item => {
      grid.appendChild(
        createCard(item)
      );
    });

    moreButton.hidden =
      filtered.length <= INITIAL_COUNT;

    moreButton.textContent = expanded
      ? "Mostra meno ↑"
      : "Mostra altre comunità ↓";

  }

  moreButton.addEventListener(
    "click",
    function () {

      expanded = !expanded;
      render();

    }
  );

  render();

})();
</script>
